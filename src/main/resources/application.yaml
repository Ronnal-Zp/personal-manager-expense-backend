spring:
  application:
    name: personal-manager-expense-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_manager_expense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
